# Put this file in your fork at:  .github/workflows/build-ipodvideo.yml
# Run it from GitHub -> Actions -> "Build iPod Video" -> Run workflow.
# First run builds the ARM cross-compiler (about 40-60 minutes); it is cached afterwards
# and later runs take a few minutes.  Output: artifact "rockbox-ipodvideo"
# (rockbox.zip = full install tree, rockbox.ipod = the firmware image alone).
#
# Untested by me: if a step fails, send me the log of the failing step.
name: Build iPod Video

on:
  workflow_dispatch:
  push:
    branches: [ bcm-host ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget xz-utils bzip2 gzip patch texinfo \
            automake autoconf libtool flex bison perl python3 zip unzip git ccache \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev

      - name: Cache ARM toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/rbdev
          key: rbdev-arm-gcc9.5-${{ hashFiles('tools/rockboxdev.sh') }}

      - name: Build ARM toolchain (arm-elf-eabi)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/rbdev
          sudo chown "$USER" /opt/rbdev
          RBDEV_PREFIX=/opt/rbdev RBDEV_TARGET=a tools/rockboxdev.sh

      - name: Configure (ipodvideo, normal build)
        run: |
          export PATH=/opt/rbdev/arm-elf-eabi/bin:$PATH
          mkdir -p build
          cd build
          ../tools/configure --target=ipodvideo --type=n

      - name: Build
        run: |
          export PATH=/opt/rbdev/arm-elf-eabi/bin:$PATH
          cd build
          make -j"$(nproc)"
          make zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-ipodvideo
          path: |
            build/rockbox.zip
            build/rockbox.ipod
