name: Build iPod Video (bcm-rockbox v94)

on:
  push:
    branches: [ "bcm-rockbox-v94" ]
  pull_request:
    branches: [ "bcm-rockbox-v94" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
               libsdl2-dev zip

      - name: Apply bcm_overlay_v94
        run: |
          cd $GITHUB_WORKSPACE
          bash bcm_overlay_v94/apply_overlay.sh

      - name: Configure
        run: |
          mkdir build-ipodvideo
          cd build-ipodvideo
          echo -e "20\n1\n" | ../tools/configure

      - name: Build
        run: |
          cd build-ipodvideo
          make -j$(nproc) 2>&1 | tee build.log
          grep -E "^(Error|error:)" build.log || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-ipodvideo-bcm-v94
          path: |
            build-ipodvideo/.rockbox/
            build-ipodvideo/rockbox.ipod
