name: Build iPod Video

on:
  workflow_dispatch:
  push:
    branches: [ bcm-host ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget xz-utils bzip2 gzip patch texinfo \
            automake autoconf libtool libtool-bin flex bison perl python3 zip unzip git ccache \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev

      - name: Restore ARM toolchain cache
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: /opt/rbdev
          key: rbdev-arm-gcc9.5-${{ hashFiles('tools/rockboxdev.sh') }}

      - name: Build ARM toolchain (arm-elf-eabi)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          sudo mkdir -p /opt/rbdev
          sudo chown "$USER" /opt/rbdev
          RBDEV_PREFIX=/opt/rbdev RBDEV_TARGET=a tools/rockboxdev.sh 2>&1 | tee /tmp/toolchain.log

      - name: Toolchain failure details
        if: failure() && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          { echo '### toolchain build failed'; echo '```'; tail -60 /tmp/toolchain.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ARM toolchain cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/rbdev
          key: rbdev-arm-gcc9.5-${{ hashFiles('tools/rockboxdev.sh') }}

      - name: Check toolchain
        run: |
          export PATH=/opt/rbdev/bin:$PATH
          which arm-elf-eabi-gcc
          arm-elf-eabi-gcc --version | head -1

      - name: Configure (ipodvideo, normal build)
        run: |
          export PATH=/opt/rbdev/bin:$PATH
          mkdir -p build
          cd build
          ../tools/configure --target=ipodvideo --type=n

      - name: Build
        run: |
          export PATH=/opt/rbdev/bin:$PATH
          cd build
          set +e
          make -j"$(nproc)" > ../make.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            { echo '### make failed'; echo '```'
              grep -n -E "error|undefined reference|No rule" ../make.log | head -40
              echo '--- last lines ---'; tail -40 ../make.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -80 ../make.log
            exit $rc
          fi
          set -e
          make zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-ipodvideo
          path: |
            build/rockbox.zip
            build/rockbox.ipod
